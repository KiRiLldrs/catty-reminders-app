name: CD

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e

            APP_DIR=/home/kirill/desktop/devops
            DEPLOY_REF=${{ github.sha }}
            
            cd $APP_DIR

            echo "DEPLOY_REF=$DEPLOY_REF" > .env
            echo ">>> Created .env with DEPLOY_REF=$DEPLOY_REF"

            # Авторизация в реестре
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u kirilldrs --password-stdin

            echo ">>> Waiting for image to appear in registry..."
            for i in $(seq 1 12); do
              if docker manifest inspect "ghcr.io/kirilldrs/catty-reminders-app:$DEPLOY_REF" &>/dev/null; then
                echo "✓ Image found!"
                break
              fi
              echo "⏳ Waiting... ($i/12)"
              sleep 10
            done

            docker compose pull
            docker compose up -d --force-recreate --remove-orphans

            echo "Waiting for app to be ready..."
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8181 >/dev/null; then
                echo "✓ App is reachable"
                exit 0
              fi
              echo "⏳ Attempt $i/30..."
              sleep 5
            done

            echo "✗ App failed to start"
            echo "=== Docker Compose PS ==="
            docker compose ps
            echo "=== App Logs ==="
            docker compose logs --tail=50 app
            echo "=== DB Logs ==="
            docker compose logs --tail=20 db

            exit 1
