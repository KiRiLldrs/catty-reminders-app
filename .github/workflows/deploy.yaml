name: CD

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy exact release commit with Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e

            # Твои пути
            cd /home/kirill/desktop/devops
            
            # Получаем точный коммит релиза
            git fetch --all --tags
            git checkout --detach ${{ github.sha }}

            # Авторизация в реестре
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Pull и up с передачей переменных в docker compose
            # (как у товарища, но с твоими значениями)
            IMAGE_NAME=ghcr.io/kirilldrs/catty-reminders-app \
            IMAGE_TAG=${{ github.sha }} \
            docker compose pull

            IMAGE_NAME=ghcr.io/kirilldrs/catty-reminders-app \
            IMAGE_TAG=${{ github.sha }} \
            docker compose up -d --force-recreate --remove-orphans

            # Проверка доступности (твой стиль)
            echo "Waiting for app..."
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8181 >/dev/null; then
                echo "✓ App is reachable"
                exit 0
              fi
              sleep 5
            done

            # Отладка при ошибке
            echo "✗ App failed to start"
            docker compose ps
            docker compose logs app
            docker compose logs db
            exit 1
