name: CD

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e

            APP_DIR=/home/kirill/desktop/devops
            IMAGE_NAME=ghcr.io/kirilldrs/catty-reminders-app
            IMAGE_TAG=${{ github.sha }}

            cd $APP_DIR

            git fetch --all --tags
            git checkout --detach $IMAGE_TAG

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u kirilldrs --password-stdin

            IMAGE_NAME=$IMAGE_NAME IMAGE_TAG=$IMAGE_TAG docker compose pull
            IMAGE_NAME=$IMAGE_NAME IMAGE_TAG=$IMAGE_TAG docker compose up -d --force-recreate --remove-orphans

            echo "Waiting for app..."

            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8181 >/dev/null; then
                echo "✓ App is reachable"
                exit 0
              fi
              sleep 5
            done

            echo "✗ App failed to start"

            docker compose ps
            docker compose logs app
            docker compose logs db

            exit 1
