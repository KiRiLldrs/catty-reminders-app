name: catty-reminders-app

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root_password
      MARIADB_ROOT_HOST: "%"
      MARIADB_DATABASE: catty_db
      MARIADB_USER: catty
      MARIADB_PASSWORD: catty_password
    volumes:
      - catty-db:/var/lib/mysql

  app:
    image: ${IMAGE_NAME:-ghcr.io/kirilldrs/catty-reminders-app}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8181:8181"
    environment:
      DEPLOY_REF: ${IMAGE_TAG:-unknown}
      DATABASE_URL: mysql+pymysql://catty:catty_password@db:3306/catty_db

volumes:
  catty-db:
